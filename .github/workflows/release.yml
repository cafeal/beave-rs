name: Release

# Publishes the version in Cargo.toml to crates.io, then tags the commit and
# creates a GitHub release. Run it manually from the Actions tab on `main`.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Read the version
        id: version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "beavers") | .version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Check that the version is new
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists; bump the version in Cargo.toml first."
            exit 1
          fi
          status="$(curl -s -o /dev/null -w '%{http_code}' -A 'beave-rs release workflow' \
            "https://crates.io/api/v1/crates/beavers/$VERSION")"
          if [ "$status" = "200" ]; then
            echo "::error::beavers $VERSION is already on crates.io."
            exit 1
          fi
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "Published \`beavers $VERSION\` to crates.io." > notes.md
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
