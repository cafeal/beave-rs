name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  check:
    name: Test, lint, and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - name: Test (default features)
        run: cargo test --offline --locked
      - name: Test (all features)
        run: cargo test --offline --locked --all-features
      - name: Clippy
        run: cargo clippy --offline --locked --all-features --all-targets -- -D warnings
      - name: Docs
        run: cargo doc --offline --locked --all-features --no-deps

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - name: Check (all features)
        run: cargo check --offline --locked --all-features --all-targets

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the crate from its package
        run: cargo package --locked

  whitespace:
    name: Whitespace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for whitespace errors
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  live:
    name: Live broker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Kafka, Pulsar, RabbitMQ, and ElasticMQ
        run: docker compose up --detach kafka pulsar rabbitmq elasticmq
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - name: Build tests
        run: cargo test --offline --locked --all-features --no-run
      - name: Wait for brokers
        run: docker compose up --detach --wait kafka pulsar rabbitmq elasticmq
      - name: Test against live brokers
        run: cargo test --offline --locked --all-features -- --ignored
      - name: Broker logs
        if: failure()
        run: docker compose logs kafka pulsar rabbitmq elasticmq

  examples:
    name: Example (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: kafka-orders
            services: kafka
          - scenario: pulsar-orders
            services: pulsar
          - scenario: kafka-to-pulsar
            services: kafka pulsar
          - scenario: kafka-to-http
            services: kafka
          - scenario: transform
            services: ""
    steps:
      - uses: actions/checkout@v4
      - name: Start brokers
        if: matrix.services != ''
        run: docker compose up --detach ${{ matrix.services }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.scenario }}
      - run: cargo fetch --locked
      - name: Wait for brokers
        if: matrix.services != ''
        run: docker compose up --detach --wait ${{ matrix.services }}
      - name: Run example
        run: .github/scripts/example.sh ${{ matrix.scenario }}
      - name: Broker logs
        if: failure() && matrix.services != ''
        run: docker compose logs ${{ matrix.services }}
