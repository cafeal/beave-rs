name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  check:
    name: Test, lint, and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - name: Test (default features)
        run: cargo test --offline --locked
      - name: Test (all features)
        run: cargo test --offline --locked --all-features
      - name: Clippy
        run: cargo clippy --offline --locked --all-features --all-targets -- -D warnings
      - name: Docs
        run: cargo doc --offline --locked --all-features --no-deps

  whitespace:
    name: Whitespace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for whitespace errors
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  live:
    name: Live broker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Kafka and Pulsar
        run: docker compose up --detach kafka pulsar
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - name: Build tests
        run: cargo test --offline --locked --all-features --no-run
      - name: Wait for brokers
        run: docker compose up --detach --wait kafka pulsar
      - name: Test against live brokers
        run: cargo test --offline --locked --all-features -- --ignored
      - name: Broker logs
        if: failure()
        run: docker compose logs kafka pulsar
