name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - tools/pages/**
      - .github/workflows/pages.yml
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - site/**
      - docs/**
      - tools/pages/**
      - .github/workflows/pages.yml
  workflow_dispatch:

# Deployments and previews all push to the gh-pages branch, so they run one at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site
    # Pull requests from forks cannot push to gh-pages.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/pages/package-lock.json
      - name: Build site
        if: github.event.action != 'closed'
        env:
          SITE_URL: ${{ github.event_name == 'pull_request' && format('https://{0}.github.io/{1}/pr-preview/pr-{2}/', github.repository_owner, github.event.repository.name, github.event.number) || '' }}
        run: |
          npm ci --prefix tools/pages
          node tools/pages/build.mjs _site
      - name: Publish main site
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
      - name: Publish pull request preview
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
