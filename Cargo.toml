[package]
name = "beavers"
version = "0.0.2"
edition = "2024"
rust-version = "1.94.1"
description = "Typed message processing for Kafka, Pulsar, RabbitMQ, SQS, Azure Service Bus, and HTTP with explicit delivery semantics"
license = "MIT"
repository = "https://github.com/cafeal/beave-rs"
documentation = "https://docs.rs/beavers"
readme = "README.md"
keywords = ["kafka", "pulsar", "rabbitmq", "messaging", "stream"]
categories = ["asynchronous", "network-programming"]
include = [
    "/src",
    "/examples",
    "/tests",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
]

[package.metadata.docs.rs]
all-features = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "io-util", "io-std"] }
tracing = "0.1"
metrics = "0.24"
erased-serde = "0.4"

[features]
default = []
avro = ["dep:apache-avro"]
protobuf = ["dep:prost"]
msgpack = ["dep:rmp-serde"]
cbor = ["dep:ciborium"]
base64 = ["dep:base64"]
gzip = ["dep:flate2"]
zstd = ["dep:zstd"]
kafka = ["dep:rdkafka"]
pulsar = ["dep:magnetar", "dep:base64", "dep:bytes", "dep:futures-util"]
rabbitmq = ["dep:lapin", "dep:futures-util"]
sqs = ["dep:aws-config", "dep:aws-sdk-sqs"]
pubsub = ["dep:google-cloud-pubsub", "dep:google-cloud-auth", "dep:google-cloud-gax"]
servicebus = [
    "dep:fe2o3-amqp",
    "dep:fe2o3-amqp-cbs",
    "dep:serde_amqp",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:hmac",
    "dep:sha2",
    "dep:base64",
    "tokio/net",
]
opentelemetry = ["dep:opentelemetry", "dep:tracing-opentelemetry"]
testing = []
javascript = ["dep:rquickjs"]
python = ["dep:pyo3"]
http = ["dep:hyper", "dep:hyper-util", "dep:hyper-rustls", "dep:rustls", "dep:http-body-util", "dep:bytes", "tokio/net"]
health = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:bytes", "tokio/net"]

[dependencies.rquickjs]
version = "0.14"
features = ["parallel"]
optional = true

[dependencies.pyo3]
version = "0.29"
features = ["auto-initialize"]
optional = true

[dependencies.rdkafka]
version = "0.39"
optional = true

[dependencies.magnetar]
package = "magnetar-driver"
version = "1.7"
default-features = false
features = ["tokio", "crypto-ring"]
optional = true

[dependencies.lapin]
version = "4.12"
default-features = false
features = ["tokio", "rustls--ring", "rustls-native-certs"]
optional = true

[dependencies.aws-config]
version = "1.8"
default-features = false
features = ["rt-tokio", "default-https-client", "behavior-version-latest"]
optional = true

[dependencies.aws-sdk-sqs]
version = "1.90"
default-features = false
features = ["rt-tokio", "default-https-client", "behavior-version-latest"]
optional = true

[dependencies.google-cloud-pubsub]
version = "1.6"
optional = true

[dependencies.google-cloud-auth]
version = "1.17"
default-features = false
optional = true

[dependencies.google-cloud-gax]
version = "1.15"
default-features = false
optional = true

[dependencies.fe2o3-amqp]
version = "0.18"
default-features = false
optional = true

[dependencies.fe2o3-amqp-cbs]
version = "0.18"
optional = true

[dependencies.serde_amqp]
version = "0.18"
default-features = false
optional = true

[dependencies.tokio-rustls]
version = "0.26"
default-features = false
features = ["ring", "tls12"]
optional = true

[dependencies.rustls-native-certs]
version = "0.8"
optional = true

[dependencies.hmac]
version = "0.13"
optional = true

[dependencies.sha2]
version = "0.11"
default-features = false
optional = true

[dependencies.base64]
version = "0.22"
optional = true

[dependencies.bytes]
version = "1"
optional = true

[dependencies.futures-util]
version = "0.3"
optional = true

[dependencies.hyper]
version = "1"
features = ["client", "server", "http1"]
optional = true

[dependencies.hyper-util]
version = "0.1"
features = ["tokio", "client-legacy", "server", "server-graceful", "http1"]
optional = true

[dependencies.hyper-rustls]
version = "0.27"
default-features = false
features = ["http1", "native-tokio", "ring", "tls12"]
optional = true

[dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std", "tls12"]
optional = true

[dependencies.http-body-util]
version = "0.1"
optional = true

[dependencies.prost]
version = "0.13"
optional = true

[dependencies.rmp-serde]
version = "1.3"
optional = true

[dependencies.ciborium]
version = "0.2"
optional = true

[dependencies.flate2]
version = "1.1"
optional = true

[dependencies.zstd]
version = "0.14"
default-features = false
optional = true

[dependencies.apache-avro]
version = "0.22"
default-features = false
optional = true

[dependencies.opentelemetry]
version = "0.33"
default-features = false
features = ["trace"]
optional = true

[dependencies.tracing-opentelemetry]
version = "0.34"
default-features = false
optional = true

[dev-dependencies]
anyhow = "1"
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "testing"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
tokio = { version = "1", features = ["net"] }

[[example]]
name = "kafka_orders"
required-features = ["kafka"]

[[example]]
name = "pulsar_orders"
required-features = ["pulsar"]

[[example]]
name = "kafka_to_pulsar"
required-features = ["kafka", "pulsar"]

[[example]]
name = "kafka_to_http"
required-features = ["kafka", "http"]
