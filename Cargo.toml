[package]
name = "beavers"
version = "0.1.0"
edition = "2024"
description = "Typed message processing with explicit delivery semantics"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "io-util", "io-std"] }

[features]
default = []
avro = ["dep:apache-avro"]
protobuf = ["dep:prost"]
kafka = ["dep:rdkafka"]
pulsar = ["dep:pulsar", "dep:futures-util"]

[dependencies.rdkafka]
version = "0.39"
optional = true

[dependencies.pulsar]
version = "6.9"
default-features = false
features = ["tokio-runtime"]
optional = true

[dependencies.futures-util]
version = "0.3"
optional = true

[dependencies.prost]
version = "0.13"
optional = true

[dependencies.apache-avro]
version = "0.22"
default-features = false
optional = true
