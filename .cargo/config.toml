# Shortcuts for the broker examples and live tests. Start the local brokers
# first with `docker compose up -d --wait`; see docs/development.md.
[alias]
kafka-produce = "run --example kafka_orders --features kafka -- produce"
kafka-process = "run --example kafka_orders --features kafka -- process"
pulsar-produce = "run --example pulsar_orders --features pulsar -- produce"
pulsar-process = "run --example pulsar_orders --features pulsar -- process"
kafka-to-pulsar = "run --example kafka_to_pulsar --features kafka,pulsar"
http-receive = "run --example kafka_to_http --features kafka,http -- receive"
kafka-to-http = "run --example kafka_to_http --features kafka,http -- forward"
test-live = "test --features kafka,pulsar,rabbitmq,sqs -- --ignored"
