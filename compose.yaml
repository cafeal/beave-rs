# Local development brokers for examples and ignored live tests.
# See docs/local-brokers.md for usage.

name: beavers

services:
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # HOST is advertised to applications on the host; DOCKER serves other
      # containers such as the UI.
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null
      interval: 5s
      timeout: 20s
      retries: 30
      start_period: 10s

  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  pulsar:
    image: apachepulsar/pulsar:4.0.6
    command:
      - sh
      - -c
      - bin/apply-config-from-env.py conf/standalone.conf && exec bin/pulsar standalone --no-functions-worker --no-stream-storage
    ports:
      - "6650:6650"
      - "8080:8080"
    environment:
      PULSAR_MEM: -Xms512m -Xmx512m -XX:MaxDirectMemorySize=512m
      # Applied to conf/standalone.conf by apply-config-from-env.py.
      transactionCoordinatorEnabled: "true"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:8080/admin/v2/brokers/health > /dev/null
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  pulsar-manager:
    image: apachepulsar/pulsar-manager:v0.4.0
    ports:
      - "9527:9527"
    environment:
      SPRING_CONFIGURATION_FILE: /pulsar-manager/pulsar-manager/application.properties
      DEFAULT_ENVIRONMENT_NAME: local
      DEFAULT_ENVIRONMENT_SERVICE_URL: http://pulsar:8080
    depends_on:
      pulsar:
        condition: service_healthy

  # One-shot setup: creates the pulsar_orders example subscription at the
  # earliest position, so orders produced before the example's first run are
  # consumed, and creates the Pulsar Manager login admin / apachepulsar.
  pulsar-init:
    image: apachepulsar/pulsar:4.0.6
    entrypoint:
      - sh
      - -ec
      - |
        bin/pulsar-admin --admin-url http://pulsar:8080 topics create-subscription \
          --subscription beavers-examples --messageId earliest \
          persistent://public/default/orders 2>&1 | grep -v "already exists" || true
        until csrf=$$(curl -fs -c /tmp/cookies http://pulsar-manager:7750/pulsar-manager/csrf-token); do
          sleep 2
        done
        curl -fsS -b /tmp/cookies -H "X-XSRF-TOKEN: $$csrf" -H "Content-Type: application/json" \
          -X PUT http://pulsar-manager:7750/pulsar-manager/users/superuser \
          -d '{"name":"admin","password":"apachepulsar","description":"Local development","email":"admin@example.com"}'
        echo
    depends_on:
      pulsar:
        condition: service_healthy
      pulsar-manager:
        condition: service_started
